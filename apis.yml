aid: zavu
name: Zavu
description: >-
  Zavu is a unified multi-channel messaging platform that consolidates SMS,
  WhatsApp, Telegram, Email, Voice, and Messenger behind a single REST API, so
  developers integrate once instead of stitching together Twilio, Vonage,
  MessageBird and others. The Unified Messaging Layer API adds smart ML-powered
  channel routing with automatic fallback and retry, signed webhooks for delivery
  and inbound events, WhatsApp templates and 10DLC brand/campaign registration,
  broadcasts with AI content review, contacts, AI agents with flows and RAG
  knowledge bases, serverless TypeScript functions (Zavu Cloud), and phone-number
  provisioning. Auth is API-key bearer tokens with test (zv_test_) and live
  (zv_live_) modes, idempotency keys, cursor pagination, and per-project rate
  limiting. Official SDKs ship for TypeScript, Python, Ruby, Go, and PHP, plus an
  official MCP server. Zavu is a 500 Global portfolio company.
