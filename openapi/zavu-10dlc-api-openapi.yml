          maxItems: 5
        messageFlow:
          type: string
          maxLength: 2048
        helpMessage:
          type: string
          maxLength: 500
        optInKeywords:
          type: array
          items:
            type: string
            maxLength: 50
        optOutKeywords:
          type: array
          items:
            type: string
            maxLength: 50
