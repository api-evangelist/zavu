    TenDlcBrandCreateRequest:
      type: object
      required:
      - entityType
      - displayName
      - email
      - phone
      - street
      - city
      - state
      - postalCode
      - country
      - vertical
      properties:
        entityType:
          $ref: '#/components/schemas/TenDlcEntityType'
        displayName:
          type: string
          maxLength: 100
          description: Display name of the brand.
          example: Acme Corp
        companyName:
          type: string
          maxLength: 200
          description: Legal company name.
        ein:
          type: string
          description: 'Employer Identification Number (format: XX-XXXXXXX).'
          example: 12-3456789
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: string
          description: Contact phone in E.164 format.
          example: '+14155551234'
        street:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 50
        postalCode:
          type: string
          maxLength: 20
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-letter ISO country code.
          example: US
        website:
          type: string
          format: uri
        vertical:
          type: string
          maxLength: 50
          description: Industry vertical.
          example: Technology
        stockSymbol:
          type: string
          maxLength: 10
        stockExchange:
          type: string
          maxLength: 50
    TenDlcEntityType:
      type: string
      description: Business entity type for 10DLC brand registration.
      enum:
      - PRIVATE_PROFIT
      - PUBLIC_PROFIT
      - NON_PROFIT
      - GOVERNMENT
      - SOLE_PROPRIETOR
